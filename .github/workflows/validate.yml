name: Validate catalogue source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          python3 -m venv .validation-python
          .validation-python/bin/pip install cryptography==50.0.2 cffi==2.0.0 pycparser==2.23 Pillow==12.3.0
      - run: .validation-python/bin/python -m unittest discover -s tests -v
      - run: .validation-python/bin/python tools/catalogue.py validate
