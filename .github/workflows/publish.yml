name: Publish signed catalogue
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First catalogue publication only; never reset existing history
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: catalogue-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.13' }
      - run: |
          python3 -m venv .release-python
          .release-python/bin/pip install cryptography==50.0.2 cffi==2.0.0 pycparser==2.23 Pillow==12.3.0
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - run: .release-python/bin/python -m unittest discover -s tests -v
      - name: Verify metadata, all downloads and archive contents without signing credentials
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = true ]; then args+=(--bootstrap); fi
          .release-python/bin/python tools/release.py prepare --out verified "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-index
          path: verified/index.json
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: catalogue-release
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-index
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.13' }
      - run: |
          python3 -m venv .release-python
          .release-python/bin/pip install --only-binary=:all: --require-hashes -r requirements-signing.txt
      - name: Sign verified index from the approved source commit
        env:
          CATALOGUE_ED25519_KEY: ${{ secrets.CATALOGUE_ED25519_KEY }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          args=()
          if [ "$BOOTSTRAP" = true ]; then args+=(--bootstrap); fi
          .release-python/bin/python tools/release.py sign --out dist "${args[@]}"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
